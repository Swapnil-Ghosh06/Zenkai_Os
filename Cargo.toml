[package]
name = "zenkai_os"
version = "0.9.2"
edition = "2021"
authors = ["Swapnil Ghosh 25BTRCL267 AIML-E"]
description = "Zenkai OS: UEFI x86_64 Educational Micro-Kernel & R19 AI/ML Research Engine"

[[bin]]
name = "zenkai_os"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.33.0", features = ["alloc", "logger"] }
log = "0.4"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
