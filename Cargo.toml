[package]
name = "zenkai_os"
version = "0.1.0"
edition = "2021"
authors = ["Swapnil Ghosh"]
description = "Zenkai OS - Educational Micro-Kernel for Systems Engineering & AI Memory Research (CA-6)"

[dependencies]
uefi = { version = "0.33.0", features = ["alloc", "logger"] }
log = "0.4"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
