[package]
name = "zengi_os"
version = "0.9.2"
edition = "2024"
rust-version = "1.86"
authors = ["Swapnil Ghosh 25BTRCL267 AIML-E"]
description = "Zengi OS: UEFI x86_64 Educational Micro-Kernel & R19 AI/ML Research Engine"

[lib]
name = "aeon"
path = "src/lib.rs"

[[bin]]
name = "zengi_os"
path = "src/main.rs"

[features]
fault-ud = []
fault-pf = []
fault-stack = []
fault-wx = []
fault-nx = []
fault-panic = []
dump-eventlog = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.dev]
panic = "abort"
opt-level = "s"
overflow-checks = true
debug = true

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
strip = "debuginfo"
